repos:
  # Basic file formatting and safety checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: debug-statements
        exclude: ^archive/
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: detect-private-key
      - id: mixed-line-ending

  # Python code quality and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.4
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^archive/
      - id: ruff-format
        exclude: ^archive/

  # Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies:
          [types-requests, types-setuptools, pandas-stubs, types-toml]
        args: [--strict, --ignore-missing-imports, --show-error-codes]
        exclude: ^(archive/|tests/)
        files: ^src/
